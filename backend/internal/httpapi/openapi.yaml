openapi: 3.1.0
info:
  title: Sidekick API
  version: 1.0.0
  description: |
    Two-sided marketplace for short, local tasks.

    ## Authentication
    All endpoints (except `POST /auth/*` and `GET /health`) require a **Bearer JWT** token
    in the `Authorization` header. Obtain tokens via signup, signin, or OAuth.

    ## Money
    All monetary values are **integer minor units** (pence/cents). Never floats.

    ## Rate Limits
    - Search: 30 req/min per user
    - OTP send: 60s cooldown, 5/hour
    - Messages: 30/min per conversation

    ## Idempotency
    Financial operations (`/tasks/{id}/fund`, `/offers/{id}/accept`, `/me/withdrawals`)
    require an `idempotency_key` in the request body. Replays return the original result.

    ## Contact Detail Leak Detection
    Messages are scanned for phone numbers, emails, and URLs. Matches are flagged
    (not blocked) and logged to audit_log.

    ## Double-Blind Reviews
    Reviews are hidden until both parties submit or 14 days pass, whichever comes first.
    Published reviews cannot be edited or deleted.
  contact:
    name: Sidekick API Support
  license:
    name: Private

servers:
  - url: /
    description: Current deployment

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness probes
  - name: Auth
    description: Signup, signin, OAuth, OTP, password reset, sessions
  - name: Users
    description: Profile, avatar, push tokens, role, verification
  - name: Tasks
    description: CRUD, drafts, photos, fee quotes, funding, escrow
  - name: Discovery
    description: Feed, search, filtering
  - name: Offers
    description: Make, counter, accept, decline, withdraw
  - name: Messaging
    description: Conversations, messages, images, blocks, reports
  - name: Execution
    description: Complete, confirm, dispute, cancel, auto-release
  - name: Finance
    description: Wallet, cards, payout methods, withdrawals, transactions, receipts
  - name: Reviews
    description: Submit, list, publish cron
  - name: Trust & Safety
    description: Verification, reports, disputes, leak detection
  - name: Notifications
    description: List, read, unread count, preferences
  - name: Admin
    description: Verification queue, report action, disputes, payout batches, search, user management
  - name: Webhooks
    description: Provider webhook callbacks
  - name: Cron
    description: Internal scheduled jobs (auto-release, review publish, warnings)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Generic ────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: bad_request
        message:
          type: string
          example: "missing required field: title"

    # ── Auth ───────────────────────────────────────────────────────────────
    AuthTokens:
      type: object
      description: Token pair returned on successful authentication
      properties:
        access_token:
          type: string
          description: Short-lived JWT (15 min)
        refresh_token:
          type: string
          description: Long-lived opaque token (30 days)
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        auth_provider:
          type: string
          enum: [email, google, apple]
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        phone_verified:
          type: boolean
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        role_intent:
          type: string
          nullable: true
          enum: [post, work, both]
        verification_status:
          type: string
          enum: [unverified, pending, verified, rejected]
        rating_avg:
          type: number
        rating_count:
          type: integer
        tasks_completed:
          type: integer
        onboarding_completed:
          type: boolean
        suspended_at:
          type: string
          format: date-time
          nullable: true
        banned_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PublicProfile:
      type: object
      description: Public-facing profile. Never contains phone, email, or exact location.
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        verification_status:
          type: string
        rating_avg:
          type: number
        rating_count:
          type: integer
        tasks_completed:
          type: integer
        member_since:
          type: string
          format: date-time

    # ── Tasks ──────────────────────────────────────────────────────────────
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        poster_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location_approx:
          type: string
        location_lat:
          type: number
          nullable: true
        location_lng:
          type: number
          nullable: true
        location_exact:
          type: string
          nullable: true
          description: "Only visible to poster and assigned worker"
        location_exact_lat:
          type: number
          nullable: true
        location_exact_lng:
          type: number
          nullable: true
        timing_type:
          type: string
          enum: [asap, specific_date, flexible_range]
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        flexible_from:
          type: string
          nullable: true
        flexible_to:
          type: string
          nullable: true
        budget:
          type: integer
          description: "In minor units (pence)"
        platform_fee:
          type: integer
        total_charge:
          type: integer
        status:
          type: string
          enum: [draft, open, assigned, pending_confirm, completed, cancelled, disputed, expired, released]
        offer_count:
          type: integer
        escrow_status:
          type: string
          enum: [none, secured, frozen, released, refunded]
        draft_payload:
          type: object
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/TaskPhoto'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskPhoto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        type:
          type: string
          enum: [listing, completion]

    TaskCard:
      type: object
      description: "Feed/search card. Never contains location_exact, phone, or email."
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        budget:
          type: integer
        distance_km:
          type: number
          nullable: true
        timing_type:
          type: string
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        flexible_from:
          type: string
          nullable: true
        flexible_to:
          type: string
          nullable: true
        category:
          type: string
        offer_count:
          type: integer
        location_approx:
          type: string
        created_at:
          type: string
          format: date-time
        poster:
          type: object
          properties:
            rating_avg:
              type: number
            rating_count:
              type: integer
            verification_status:
              type: string

    # ── Fees / Escrow ──────────────────────────────────────────────────────
    Quote:
      type: object
      properties:
        budget:
          type: integer
        fee:
          type: integer
        total:
          type: integer
        fee_payer:
          type: string
          enum: [poster, worker]

    Fund:
      type: object
      properties:
        fund:
          type: object
          properties:
            task_id:
              type: string
              format: uuid
            status:
              type: string
            escrow_status:
              type: string
            transaction_id:
              type: string
              format: uuid
            repeated:
              type: boolean

    Escrow:
      type: object
      properties:
        status:
          type: string
        amount:
          type: integer
        fee:
          type: integer
        provider_ref_masked:
          type: string

    # ── Offers ─────────────────────────────────────────────────────────────
    Offer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        amount:
          type: integer
        is_counter:
          type: boolean
        message:
          type: string
          nullable: true
        poster_counter_amount:
          type: integer
          nullable: true
        poster_counter_status:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined, withdrawn, auto_declined, expired]
        decline_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true

    OfferWithWorker:
      allOf:
        - $ref: '#/components/schemas/Offer'
        - type: object
          properties:
            worker_rating_avg:
              type: number
            worker_rating_count:
              type: integer
            worker_verification_status:
              type: string
            worker_tasks_completed:
              type: integer
            worker_display_name:
              type: string
            worker_avatar_url:
              type: string
              nullable: true

    AcceptResult:
      type: object
      properties:
        accept:
          type: object
          properties:
            task_id:
              type: string
              format: uuid
            offer_id:
              type: string
              format: uuid
            task_status:
              type: string
            conversation_id:
              type: string
              format: uuid
            repeated:
              type: boolean

    # ── Messaging ──────────────────────────────────────────────────────────
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        poster_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        task_title:
          type: string
        last_message_body:
          type: string
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          nullable: true
          description: "Null for system messages"
        sender_name:
          type: string
          nullable: true
        type:
          type: string
          enum: [text, image, system]
        body:
          type: string
        system_event:
          type: string
          nullable: true
        attachment_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Finance ────────────────────────────────────────────────────────────
    Wallet:
      type: object
      properties:
        available_balance:
          type: integer
          description: "In minor units (pence)"
        pending_balance:
          type: integer
        currency:
          type: string
          example: GBP
        recent_activity:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              type:
                type: string
              amount:
                type: integer
              fee:
                type: integer
              status:
                type: string
              created_at:
                type: string

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          nullable: true
        payer_id:
          type: string
          format: uuid
          nullable: true
        payee_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
        platform_fee:
          type: integer
        fee_payer:
          type: string
        type:
          type: string
          enum: [escrow_hold, release, refund, withdrawal, cancellation_compensation]
        status:
          type: string
          enum: [pending, succeeded, failed, processing]
        provider_ref:
          type: string
        created_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time
          nullable: true

    PaymentMethod:
      type: object
      description: "Tokenized card. Never stores raw PAN."
      properties:
        id:
          type: string
          format: uuid
        provider_ref:
          type: string
          description: "Masked token reference"
        last4:
          type: string
        brand:
          type: string
        exp_month:
          type: integer
        exp_year:
          type: integer
        is_default:
          type: boolean

    PayoutMethod:
      type: object
      description: "Tokenized bank account. Never stores raw account numbers."
      properties:
        id:
          type: string
          format: uuid
        bank_ref:
          type: string
          description: "Masked bank token reference"
        last4:
          type: string
        bank_name:
          type: string
        is_default:
          type: boolean

    Receipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
        platform_fee:
          type: integer
        fee_payer:
          type: string
        type:
          type: string
        status:
          type: string
        provider_ref:
          type: string
        created_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time
          nullable: true
        payer_id:
          type: string
          format: uuid
          nullable: true
        payee_id:
          type: string
          format: uuid
          nullable: true

    Withdrawal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
        status:
          type: string
        repeated:
          type: boolean

    # ── Reviews ────────────────────────────────────────────────────────────
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        reviewer_id:
          type: string
          format: uuid
        reviewee_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
          description: "Renamed from 'body' in API responses"
        body:
          type: string
          nullable: true
        is_published:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Notifications ──────────────────────────────────────────────────────
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [offer_received, offer_accepted, offer_declined, task_completed, task_confirmed, payment_released, dispute_opened, dispute_resolved, review_received, verification_approved, verification_rejected, admin_warning, system]
        title:
          type: string
        body:
          type: string
        entity_type:
          type: string
          nullable: true
        entity_id:
          type: string
          format: uuid
          nullable: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ── Trust & Safety ─────────────────────────────────────────────────────
    Verification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        document_type:
          type: string
          enum: [passport, driving_licence, national_id]
        document_url:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        rejection_reason:
          type: string
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporter_id:
          type: string
          format: uuid
        reported_user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          nullable: true
        conversation_id:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          enum: [spam, fraud, harassment, safety, off_platform_payment, other]
        detail:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, reviewing, actioned, dismissed]
        admin_action:
          type: string
          nullable: true
        admin_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        raised_by:
          type: string
          format: uuid
        reason:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, under_review, resolved]
        resolution:
          type: string
          nullable: true
          enum: [released, refunded, split, null]
        compensation_amount:
          type: integer
          nullable: true
        resolution_notes:
          type: string
          nullable: true
        resolved_by:
          type: string
          format: uuid
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Admin ──────────────────────────────────────────────────────────────
    PayoutBatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, processing, completed, failed]
        item_count:
          type: integer
        total_amount:
          type: integer
        created_by:
          type: string
          format: uuid
        confirmed_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true

    PayoutBatchItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        amount:
          type: integer
        payout_method_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        provider_ref:
          type: string
          nullable: true

paths:
  # ══════════════════════════════════════════════════════════════════════════
  # HEALTH
  # ══════════════════════════════════════════════════════════════════════════
  /health:
    get:
      operationId: healthCheck
      tags: [Health]
      security: []
      summary: Liveness probe
      description: Returns server status. Used by load balancers and monitoring.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  env:
                    type: string
                    example: prod

  # ══════════════════════════════════════════════════════════════════════════
  # AUTH
  # ══════════════════════════════════════════════════════════════════════════
  /auth/signup:
    post:
      operationId: signup
      tags: [Auth]
      security: []
      summary: Register with email and password
      description: |
        Creates a new account. Returns access + refresh tokens and user object.
        Email must be unique. Password is bcrypt-hashed server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: securePassword123
                display_name:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "John Doe"
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/signin:
    post:
      operationId: signin
      tags: [Auth]
      security: []
      summary: Sign in with email and password
      description: Returns access + refresh token pair. Invalid credentials return 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/oauth:
    post:
      operationId: oauth
      tags: [Auth]
      security: []
      summary: Google or Apple sign-in
      description: |
        Verifies the provider's ID token. Creates account if first login.
        In dev mode, the sandbox verifier accepts any token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token]
              properties:
                provider:
                  type: string
                  enum: [google, apple]
                id_token:
                  type: string
                  description: "Provider-issued ID token (JWT)"
                display_name:
                  type: string
                  description: "Used only for new accounts"
      responses:
        '200':
          description: Signed in (existing account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '201':
          description: New account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'

  /auth/phone/send:
    post:
      operationId: otpSend
      tags: [Auth]
      security: []
      summary: Send phone OTP
      description: |
        Sends a 6-digit OTP to the given phone number.
        Rate limits: 60s cooldown between sends, max 5 per hour.
        Always returns 200 (no phone enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, phone]
              properties:
                user_id:
                  type: string
                  format: uuid
                phone:
                  type: string
                  example: "+447700900123"
      responses:
        '200':
          description: OTP sent
        '409':
          description: Phone number already verified by another user
        '429':
          description: Cooldown or hourly rate limit exceeded

  /auth/phone/verify:
    post:
      operationId: otpVerify
      tags: [Auth]
      summary: Verify phone OTP
      description: |
        Verifies the 6-digit code. Max 5 attempts before 5-minute lockout.
        Sets phone_verified=true on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "123456"
      responses:
        '200':
          description: Phone verified
        '400':
          description: Invalid or expired code
        '423':
          description: Too many attempts, locked for 5 minutes

  /auth/password-reset/request:
    post:
      operationId: resetRequest
      tags: [Auth]
      security: []
      summary: Request password reset email
      description: Always returns 200 regardless of whether email exists (prevents enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: If account exists, reset email was sent

  /auth/password-reset/confirm:
    post:
      operationId: resetConfirm
      tags: [Auth]
      security: []
      summary: Confirm password reset with token
      description: |
        Exchanges the reset token for a new password.
        Invalidates all existing sessions for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  description: "Token from the reset email"
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed, all sessions revoked
        '400':
          description: Invalid or expired token

  /auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      security: []
      summary: Rotate refresh token
      description: Exchanges a valid refresh token for a new access+refresh pair. Old refresh token is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /auth/signout:
    post:
      operationId: signout
      tags: [Auth]
      summary: Sign out (revoke session)
      description: Revokes the current session. The access token becomes invalid immediately.
      responses:
        '200':
          description: Session revoked

  # ══════════════════════════════════════════════════════════════════════════
  # USERS
  # ══════════════════════════════════════════════════════════════════════════
  /me:
    get:
      operationId: getMe
      tags: [Users]
      summary: Get own full profile
      description: Returns the complete user profile including email, phone, and verification status.
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'

    patch:
      operationId: updateMe
      tags: [Users]
      summary: Update profile
      description: |
        Updates user profile fields. Only these fields are allowed:
        display_name, bio, location, latitude, longitude, avatar_url.
        Server-owned fields (rating_avg, tasks_completed, etc.) are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  minLength: 2
                  maxLength: 50
                bio:
                  type: string
                  maxLength: 500
                location:
                  type: string
                  description: "Human-readable location label"
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                avatar_url:
                  type: string
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'

  /me/role:
    post:
      operationId: setRole
      tags: [Users]
      summary: Set role intent
      description: Sets whether the user wants to post tasks, work on tasks, or both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_intent]
              properties:
                role_intent:
                  type: string
                  enum: [post, work, both]
      responses:
        '200':
          description: Role updated

  /me/account:
    delete:
      operationId: deleteAccount
      tags: [Users]
      summary: Delete account
      description: |
        Soft-deletes the account and purges PII (phone, email, exact location).
        Requires `confirm: true` in request body. Active tasks are cancelled first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: "Must be true to proceed"
      responses:
        '200':
          description: Account deleted

  /users/{id}:
    get:
      operationId: publicProfile
      tags: [Users]
      summary: Get public profile
      description: |
        Returns public profile for any user. Never contains phone, email,
        or exact location. Used by frontend to show worker/poster details.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/PublicProfile'
        '404':
          description: User not found

  /users/{id}/reviews:
    get:
      operationId: listPublicReviews
      tags: [Users, Reviews]
      summary: List public reviews for a user
      description: Returns only published reviews, most recent first.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'

  /me/avatar/upload-url:
    post:
      operationId: avatarGrant
      tags: [Users]
      summary: Get signed avatar upload URL
      description: Returns a signed upload URL for avatar image. Client uploads directly to storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type]
              properties:
                content_type:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: Upload grant
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  signature:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  /me/avatar/complete:
    post:
      operationId: avatarComplete
      tags: [Users]
      summary: Finalize avatar upload
      description: |
        After uploading to the signed URL, call this to process and set the avatar.
        Resizes image server-side and updates user avatar_url.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object, signature, expires_at, image_base64]
              properties:
                object:
                  type: string
                signature:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                image_base64:
                  type: string
                  format: byte
      responses:
        '200':
          description: Avatar set

  /me/push-tokens:
    get:
      operationId: listTokens
      tags: [Users]
      summary: List registered push tokens
      responses:
        '200':
          description: Token list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        token:
                          type: string
                        platform:
                          type: string
                          enum: [ios, android, web]

    post:
      operationId: registerToken
      tags: [Users]
      summary: Register push notification token
      description: Registers a device push token for receiving notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  description: "FCM/APNs device token"
                platform:
                  type: string
                  enum: [ios, android, web]
      responses:
        '200':
          description: Token registered

    delete:
      operationId: removeToken
      tags: [Users]
      summary: Remove push token
      description: Removes a previously registered push token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token removed

  /config/public:
    get:
      operationId: publicConfig
      tags: [Users]
      summary: Get public app configuration
      description: |
        Returns non-sensitive app config (fee percentages, auto-release hours,
        max photos, etc.). Authenticated-readable only.
      responses:
        '200':
          description: Config key-value pairs
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  # ══════════════════════════════════════════════════════════════════════════
  # TASKS
  # ══════════════════════════════════════════════════════════════════════════
  /tasks:
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create a new task
      description: |
        Creates a draft task. Task starts in "draft" status.
        Fund it with POST /tasks/{id}/fund to publish it.
        Title: 10-80 chars. Description: 20-2000 chars.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, category, location_approx, location_exact, timing_type, budget]
              properties:
                title:
                  type: string
                  minLength: 10
                  maxLength: 80
                  example: "Fix my squeaky front door"
                description:
                  type: string
                  minLength: 20
                  maxLength: 2000
                  example: "The front door hinges are squeaking loudly and need oiling or replacement"
                category:
                  type: string
                  example: "repairs"
                location_approx:
                  type: string
                  description: "Neighborhood/area label (public)"
                  example: "Peckham, London"
                location_lat:
                  type: number
                location_lng:
                  type: number
                location_exact:
                  type: string
                  description: "Full address (private to poster & assigned worker)"
                  example: "10 Downing St, London SW1A 2AA"
                location_exact_lat:
                  type: number
                location_exact_lng:
                  type: number
                timing_type:
                  type: string
                  enum: [asap, specific_date, flexible_range]
                scheduled_for:
                  type: string
                  format: date-time
                  description: "Required when timing_type=specific_date"
                flexible_from:
                  type: string
                  description: "ISO date, required when timing_type=flexible_range"
                flexible_to:
                  type: string
                  description: "ISO date, required when timing_type=flexible_range"
                budget:
                  type: integer
                  minimum: 100
                  description: "In minor units (pence). Minimum 100."
      responses:
        '201':
          description: Draft task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Validation error

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get task detail
      description: |
        Returns full task details. Location_exact fields are only visible
        to the poster and the assigned worker.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

    patch:
      operationId: editTask
      tags: [Tasks]
      summary: Edit a task
      description: |
        Editable only when:
        - Status is "draft" (any field)
        - Status is "open" with 0 offers (budget locked once funded)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                location_approx:
                  type: string
                location_exact:
                  type: string
                timing_type:
                  type: string
                scheduled_for:
                  type: string
                  format: date-time
                budget:
                  type: integer
      responses:
        '200':
          description: Updated task
        '409':
          description: Task not editable or budget locked

    delete:
      operationId: cancelTask
      tags: [Tasks]
      summary: Cancel a task
      description: |
        Cancels a task. If funded and unaccepted, triggers full refund.
        Different behavior based on status:
        - draft/open: immediate cancel
        - funded+unaccepted: refund + cancel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task cancelled
        '409':
          description: Cannot cancel in current status

  /tasks/{id}/draft:
    put:
      operationId: saveDraft
      tags: [Tasks]
      summary: Autosave draft payload
      description: |
        Saves a JSON object as the draft payload. Used for step-by-step
        task creation (partial forms are allowed).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft]
              properties:
                draft:
                  type: object
                  description: "Arbitrary JSON object with partial task data"
      responses:
        '200':
          description: Draft saved

  /me/drafts:
    get:
      operationId: listDrafts
      tags: [Tasks]
      summary: List own draft tasks
      description: Returns all tasks in "draft" status owned by the current user.
      responses:
        '200':
          description: Draft list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

  /tasks/{id}/photos/grant:
    post:
      operationId: photoGrant
      tags: [Tasks]
      summary: Get signed upload URL for task photo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type]
              properties:
                content_type:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: Upload grant

  /tasks/{id}/photos/complete:
    post:
      operationId: photoComplete
      tags: [Tasks]
      summary: Finalize task photo upload
      description: Attaches the uploaded photo to the task. Max 5 listing photos per task.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object, signature, expires_at, image_base64]
              properties:
                object:
                  type: string
                signature:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                image_base64:
                  type: string
                  format: byte
      responses:
        '201':
          description: Photo attached
        '400':
          description: Max 5 listing photos

  /tasks/{id}/fund:
    post:
      operationId: fundTask
      tags: [Tasks]
      summary: Fund a task (escrow hold)
      description: |
        Transitions a draft task to "open" by placing an escrow hold on the
        poster's payment method. Idempotent via idempotency_key.
        The hold amount = budget + platform_fee.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_id, idempotency_key]
              properties:
                payment_method_id:
                  type: string
                  description: "Saved card ID or provider token"
                  example: pm_test_card
                idempotency_key:
                  type: string
                  description: "Unique per operation, prevents double-charge"
                  example: "fund-abc123"
      responses:
        '200':
          description: Task funded, escrow secured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fund'
        '400':
          description: Invalid payment method or task status
        '502':
          description: Payment provider failed (retryable)

  /tasks/{id}/escrow:
    get:
      operationId: escrowView
      tags: [Tasks]
      summary: View escrow status
      description: Returns escrow details with masked provider reference. Poster only.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Escrow detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '403':
          description: Not the poster

  /fees/quote:
    get:
      operationId: feeQuote
      tags: [Tasks]
      summary: Get fee quote
      description: |
        Returns the platform fee for a given budget amount.
        Fee is calculated from app_config (percentage + minimum).
      parameters:
        - in: query
          name: budget
          required: true
          schema:
            type: integer
            minimum: 100
          description: "Task budget in minor units (pence)"
      responses:
        '200':
          description: Fee quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote:
                    $ref: '#/components/schemas/Quote'

  # ══════════════════════════════════════════════════════════════════════════
  # DISCOVERY
  # ══════════════════════════════════════════════════════════════════════════
  /feed:
    get:
      operationId: feed
      tags: [Discovery]
      summary: Discovery feed
      description: |
        Returns open task cards sorted by distance (nearest first), then
        recency. Results are keyset-paginated. Cards never contain
        location_exact, phone, or email.
      parameters:
        - in: query
          name: lat
          schema:
            type: number
          description: "User's current latitude"
        - in: query
          name: lng
          schema:
            type: number
          description: "User's current longitude"
        - in: query
          name: radius_km
          schema:
            type: number
          description: "Search radius in km (max 50, default 10)"
        - in: query
          name: category
          schema:
            type: string
          description: "Filter by task category"
        - in: query
          name: min_budget
          schema:
            type: integer
          description: "Minimum budget in pence"
        - in: query
          name: max_budget
          schema:
            type: integer
          description: "Maximum budget in pence"
        - in: query
          name: timing
          schema:
            type: string
            enum: [asap, specific_date, flexible_range]
          description: "Filter by timing type"
        - in: query
          name: cursor
          schema:
            type: string
          description: "Opaque cursor from previous response"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Feed results
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskCard'
                  next_cursor:
                    type: string
                    nullable: true
                  radius_km_applied:
                    type: number

  /search:
    get:
      operationId: search
      tags: [Discovery]
      summary: Full-text task search
      description: |
        Combines PostgreSQL full-text search with trigram similarity for
        fuzzy matching. Rate limited to 30 requests per minute.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: "Search query (min 2 chars)"
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lng
          schema:
            type: number
        - in: query
          name: radius_km
          schema:
            type: number
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: min_budget
          schema:
            type: integer
        - in: query
          name: max_budget
          schema:
            type: integer
        - in: query
          name: timing
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskCard'
                  next_cursor:
                    type: string
                    nullable: true
        '429':
          description: Rate limit exceeded (30/min)

  # ══════════════════════════════════════════════════════════════════════════
  # OFFERS
  # ══════════════════════════════════════════════════════════════════════════
  /tasks/{id}/offers:
    post:
      operationId: createOffer
      tags: [Offers]
      summary: Make an offer
      description: |
        Worker offers to complete the task. Default amount = task budget.
        Counter-offers (different amount) require a message.
        One pending offer per worker per task.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  description: "Offer amount in pence (defaults to task budget)"
                message:
                  type: string
                  maxLength: 300
                  description: "Optional message to the poster"
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer:
                    $ref: '#/components/schemas/Offer'
        '409':
          description: Already have a pending offer for this task

    get:
      operationId: listOffers
      tags: [Offers]
      summary: List offers for a task
      description: Returns all offers for the task, ranked by worker reputation. Poster only.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ranked offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfferWithWorker'

  /me/offers:
    get:
      operationId: myOffers
      tags: [Offers]
      summary: List my offers
      description: Returns the current user's offers with optional status filter.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, accepted, declined, withdrawn, auto_declined, expired]
      responses:
        '200':
          description: My offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'

  /offers/{id}/accept:
    post:
      operationId: acceptOffer
      tags: [Offers]
      summary: Accept an offer
      description: |
        Atomic 9-step operation:
        1. Lock task row
        2. Verify offer is pending
        3. Auto-decline all sibling offers
        4. Set task status to "assigned"
        5. Record accepted offer
        6. Create conversation
        7. Insert system message "Offer accepted"
        8. Update worker's tasks_completed
        9. Commit transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key:
                  type: string
                location_exact:
                  type: string
                  description: "Exact address revealed to accepted worker"
      responses:
        '200':
          description: Offer accepted, task assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
        '409':
          description: Task no longer available

  /offers/{id}/decline:
    post:
      operationId: declineOffer
      tags: [Offers]
      summary: Decline an offer
      description: Poster declines the offer. Optional reason included in decline notification.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Offer declined

  /offers/{id}/counter:
    post:
      operationId: counterOffer
      tags: [Offers]
      summary: Counter an offer
      description: |
        Poster counters with a different amount. Only one round of
        counter-offering is allowed. Worker can then accept or decline.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  description: "Counter amount in pence"
      responses:
        '200':
          description: Counter-offer created
        '409':
          description: Already countered or offer not pending

  /offers/{id}/respond:
    post:
      operationId: respondCounter
      tags: [Offers]
      summary: Respond to counter-offer
      description: Worker accepts or declines the poster's counter-offer. Accept triggers assignment.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, decline]
      responses:
        '200':
          description: Response recorded

  /offers/{id}/withdraw:
    post:
      operationId: withdrawOffer
      tags: [Offers]
      summary: Withdraw a pending offer
      description: Worker withdraws their pending offer before the poster responds.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Offer withdrawn
        '409':
          description: Offer not pending

  # ══════════════════════════════════════════════════════════════════════════
  # MESSAGING
  # ══════════════════════════════════════════════════════════════════════════
  /conversations:
    get:
      operationId: listConversations
      tags: [Messaging]
      summary: List conversations
      description: Returns conversations the user participates in, ordered by last message time.
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'

  /tasks/{id}/conversation:
    get:
      operationId: getConversation
      tags: [Messaging]
      summary: Get conversation for a task
      description: Returns the conversation between poster and assigned worker. Either party can access.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'

  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [Messaging]
      summary: List messages
      description: |
        Returns messages in a conversation. Participants only.
        Most recent first, keyset-paginated.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          schema:
            type: string
          description: "Message ID cursor for pagination"
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'

    post:
      operationId: sendMessage
      tags: [Messaging]
      summary: Send a text message
      description: |
        Sends a text message in the conversation. Content is sanitized
        (HTML stripped). Max 2000 characters. Rate limited to 30/min.
        Checks for blocks and frozen chat before sending.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 2000
                  example: "When can you come over?"
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '403':
          description: Blocked or chat frozen
        '429':
          description: Rate limit (30/min per conversation)

  /conversations/{id}/images/grant:
    post:
      operationId: grantChatImage
      tags: [Messaging]
      summary: Get signed upload URL for chat image
      description: Returns a signed upload URL. Supports jpg, png, webp.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type]
              properties:
                content_type:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: Upload grant

  /conversations/{id}/images:
    post:
      operationId: sendChatImage
      tags: [Messaging]
      summary: Send image message
      description: |
        After uploading to the signed URL, call this to create an image
        message. Verifies the signed upload and creates the message atomically.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object, signature, expires_at, image_base64]
              properties:
                object:
                  type: string
                signature:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                image_base64:
                  type: string
                  format: byte
      responses:
        '201':
          description: Image message created

  /conversations/{id}/report:
    post:
      operationId: reportConversation
      tags: [Messaging, Trust & Safety]
      summary: Report a conversation
      description: Creates a report against the other participant. Freezes the chat.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [spam, fraud, harassment, safety, off_platform_payment, other]
                detail:
                  type: string
                  description: "Free-text explanation (optional)"
      responses:
        '201':
          description: Report created, chat frozen

  /messages/{id}/delivered:
    post:
      operationId: markDelivered
      tags: [Messaging]
      summary: Mark message as delivered
      description: Recipient confirms delivery. Updates delivered_at timestamp.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked delivered

  /messages/{id}/read:
    post:
      operationId: markRead
      tags: [Messaging]
      summary: Mark message as read
      description: Recipient confirms they read the message. Updates read_at timestamp.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked read

  /chat-images/{object}:
    get:
      operationId: getChatImage
      tags: [Messaging]
      summary: Fetch chat image
      description: Returns the image bytes via a signed, expiring URL. Private to conversation participants.
      parameters:
        - in: path
          name: object
          required: true
          schema:
            type: string
          description: "Storage object key"
        - in: query
          name: sig
          required: true
          schema:
            type: string
          description: "HMAC signature"
        - in: query
          name: expires
          required: true
          schema:
            type: string
            format: date-time
          description: "Expiration timestamp"
      responses:
        '200':
          description: Image bytes (image/jpeg)
        '403':
          description: Invalid or expired signature

  /users/{id}/block:
    post:
      operationId: blockUser
      tags: [Messaging]
      summary: Block a user
      description: |
        Blocks the specified user. Blocked users cannot send messages
        to you. This is an upsert (idempotent).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User blocked

    delete:
      operationId: unblockUser
      tags: [Messaging]
      summary: Unblock a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unblocked

  /blocks:
    get:
      operationId: listBlocks
      tags: [Messaging]
      summary: List blocked users
      description: Returns the list of users blocked by the current user.
      responses:
        '200':
          description: Block list
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
                      properties:
                        blocked_user_id:
                          type: string
                          format: uuid
                        display_name:
                          type: string
                        created_at:
                          type: string
                          format: date-time

  # ══════════════════════════════════════════════════════════════════════════
  # EXECUTION
  # ══════════════════════════════════════════════════════════════════════════
  /tasks/{id}/complete:
    post:
      operationId: markComplete
      tags: [Execution]
      summary: Mark task as complete
      description: |
        Assigned worker marks the task as done. Status changes from
        "assigned" to "pending_confirm". Auto-release timer starts.
        Up to 5 completion photos can be attached.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                photo_urls:
                  type: array
                  items:
                    type: string
                  maxItems: 5
                  description: "URLs of completion photos"
      responses:
        '200':
          description: Marked pending confirmation
        '403':
          description: Not the assigned worker
        '409':
          description: Wrong task status

  /tasks/{id}/confirm:
    post:
      operationId: confirmCompletion
      tags: [Execution]
      summary: Confirm task completion
      description: |
        Poster confirms the work is done. Triggers:
        1. Escrow release to worker wallet
        2. Status changes to "completed"
        3. Worker tasks_completed incremented
        4. System message "Payment released" in conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Confirmed and released
        '409':
          description: Not pending confirmation or already released

  /tasks/{id}/dispute:
    post:
      operationId: raiseDispute
      tags: [Execution, Trust & Safety]
      summary: Raise a dispute
      description: |
        Either party can dispute. Freezes the escrow. Only one open
        dispute per task. Creates a dispute record and optionally a
        system message in the conversation.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, description]
              properties:
                reason:
                  type: string
                  description: "Brief reason for the dispute"
                description:
                  type: string
                  description: "Detailed explanation"
      responses:
        '201':
          description: Dispute opened, escrow frozen
        '409':
          description: Already have an open dispute

  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [Execution]
      summary: Cancel a task
      description: |
        Cancels a task. Behavior depends on status:
        - draft/open (unfunded): immediate cancel
        - funded, unaccepted: full refund
        - assigned: worker may receive compensation from app_config
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Task cancelled
        '409':
          description: Cannot cancel in current status

  /disputes/{id}/evidence:
    post:
      operationId: addEvidence
      tags: [Trust & Safety]
      summary: Upload evidence to a dispute
      description: Either party can add evidence while the dispute is open or under review.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_url]
              properties:
                evidence_url:
                  type: string
                  description: "URL to evidence document/image"
      responses:
        '200':
          description: Evidence added
        '403':
          description: Not a party to this dispute
        '409':
          description: Dispute is closed

  # ══════════════════════════════════════════════════════════════════════════
  # FINANCE
  # ══════════════════════════════════════════════════════════════════════════
  /me/wallet:
    get:
      operationId: getWallet
      tags: [Finance]
      summary: Get own wallet
      description: |
        Returns wallet balance (available + pending) and last 5 transactions.
        Wallet is created automatically on first access.
      responses:
        '200':
          description: Wallet details
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: '#/components/schemas/Wallet'

  /me/transactions:
    get:
      operationId: listTransactions
      tags: [Finance]
      summary: List transactions
      description: Returns the user's transaction history, filterable by type. Keyset-paginated.
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [escrow_hold, release, refund, withdrawal, cancellation_compensation]
          description: "Filter by transaction type"
        - in: query
          name: cursor
          schema:
            type: string
          description: "Transaction ID cursor for pagination"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  next_cursor:
                    type: string
                    nullable: true

  /me/payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [Finance]
      summary: List saved cards
      description: Returns tokenized payment methods. Raw card numbers are never stored.
      responses:
        '200':
          description: Saved cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_methods:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'

    post:
      operationId: addPaymentMethod
      tags: [Finance]
      summary: Add a payment method
      description: |
        Saves a tokenized card. Provider reference must be a token
        (pm_*, tok_*, or mock_*). Raw card numbers are rejected.
        First card is automatically set as default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_ref, last4]
              properties:
                provider_ref:
                  type: string
                  description: "Payment token from provider (never raw PAN)"
                  example: pm_test_card_visa
                last4:
                  type: string
                  description: "Last 4 digits of card"
                  example: "4242"
                brand:
                  type: string
                  example: visa
                exp_month:
                  type: integer
                  example: 12
                exp_year:
                  type: integer
                  example: 2027
      responses:
        '201':
          description: Card added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'

  /me/payment-methods/{id}:
    delete:
      operationId: deletePaymentMethod
      tags: [Finance]
      summary: Delete a saved card
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Card deleted
        '404':
          description: Card not found

  /me/payout-methods:
    get:
      operationId: listPayoutMethods
      tags: [Finance]
      summary: List payout methods
      description: Returns tokenized bank accounts for withdrawals.
      responses:
        '200':
          description: Payout methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  payout_methods:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutMethod'

    post:
      operationId: addPayoutMethod
      tags: [Finance]
      summary: Add a payout method
      description: |
        Saves a tokenized bank account. Raw account numbers are rejected.
        First payout method is automatically set as default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_ref_token]
              properties:
                bank_ref_token:
                  type: string
                  description: "Bank token from provider"
                bank_ref:
                  type: string
                last4:
                  type: string
                  example: "1234"
                bank_name:
                  type: string
                  example: "Monzo"
      responses:
        '201':
          description: Payout method added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutMethod'

  /me/withdrawals:
    post:
      operationId: createWithdrawal
      tags: [Finance]
      summary: Withdraw available balance
      description: |
        Withdraws from available balance to a payout method.
        Requires verified identity. Idempotent via idempotency_key.
        Status starts as "processing", updated via webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payout_method_id, idempotency_key]
              properties:
                amount:
                  type: integer
                  description: "Amount in pence"
                payout_method_id:
                  type: string
                  format: uuid
                  description: "Must belong to the current user"
                idempotency_key:
                  type: string
                  description: "Unique per operation"
      responses:
        '201':
          description: Withdrawal processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '400':
          description: Insufficient funds or invalid payout method
        '403':
          description: Identity verification required

  /transactions/{id}/receipt:
    get:
      operationId: getReceipt
      tags: [Finance]
      summary: Get transaction receipt
      description: Returns receipt for a transaction. Only accessible to payer or payee.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '403':
          description: Not a party to this transaction

  # ══════════════════════════════════════════════════════════════════════════
  # REVIEWS
  # ══════════════════════════════════════════════════════════════════════════
  /tasks/{id}/reviews:
    post:
      operationId: submitReview
      tags: [Reviews]
      summary: Submit a review
      description: |
        Poster or assigned worker can review after task completion.
        Reviews are double-blind: hidden until both parties submit
        or 14 days pass. Rating 1-5, optional 500-char comment.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: "Star rating (1-5)"
                comment:
                  type: string
                  maxLength: 500
                  description: "Optional text review"
      responses:
        '201':
          description: Review submitted (unpublished)
          content:
            application/json:
              schema:
                type: object
                properties:
                  review:
                    $ref: '#/components/schemas/Review'
        '409':
          description: Already reviewed this task

  /me/reviews:
    get:
      operationId: listOwnReviews
      tags: [Reviews]
      summary: List own reviews
      description: |
        Returns reviews given and received by the current user.
        Unpublished reviews about the user have rating/body hidden
        (replaced with is_published=false flag).
      responses:
        '200':
          description: Own reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  given:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  received:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'

  # ══════════════════════════════════════════════════════════════════════════
  # TRUST & SAFETY
  # ══════════════════════════════════════════════════════════════════════════
  /me/verifications:
    post:
      operationId: submitVerification
      tags: [Trust & Safety]
      summary: Submit ID verification
      description: |
        Submits a government-issued ID for verification.
        Only one pending verification allowed per user.
        Status starts as "pending", updated by admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_url]
              properties:
                document_type:
                  type: string
                  enum: [passport, driving_licence, national_id]
                  description: "Type of ID document"
                document_url:
                  type: string
                  description: "URL to the uploaded document"
                  example: "https://storage.example.com/docs/passport.jpg"
      responses:
        '201':
          description: Verification submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending
        '409':
          description: Already have a pending verification

  /reports:
    post:
      operationId: submitReport
      tags: [Trust & Safety]
      summary: Submit a report
      description: |
        Any authenticated user can report another user.
        Optionally link to a task or conversation for context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reported_user_id, reason]
              properties:
                reported_user_id:
                  type: string
                  format: uuid
                task_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: "Related task (optional)"
                conversation_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: "Related conversation (optional)"
                reason:
                  type: string
                  enum: [spam, fraud, harassment, safety, off_platform_payment, other]
                detail:
                  type: string
                  description: "Free-text explanation (optional)"
      responses:
        '201':
          description: Report created

  /me/reports:
    get:
      operationId: listOwnReports
      tags: [Trust & Safety]
      summary: List own submitted reports
      description: Returns reports submitted by the current user. Not visible to the reported user.
      responses:
        '200':
          description: Own reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'

  # ══════════════════════════════════════════════════════════════════════════
  # NOTIFICATIONS
  # ══════════════════════════════════════════════════════════════════════════
  /me/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List notifications
      description: Returns notifications for the current user, newest first. Keyset-paginated.
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          description: "Notification ID cursor for pagination"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  next_cursor:
                    type: string
                    nullable: true

  /me/notifications/unread-count:
    get:
      operationId: unreadCount
      tags: [Notifications]
      summary: Get unread notification count
      description: Returns the count of unread notifications. Used for badge display.
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /me/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as read

  /me/notifications/read-all:
    post:
      operationId: markAllRead
      tags: [Notifications]
      summary: Mark all notifications as read
      description: Bulk-marks all unread notifications as read.
      responses:
        '200':
          description: All marked as read

  /me/notification-prefs:
    get:
      operationId: getNotificationPrefs
      tags: [Notifications]
      summary: Get notification preferences
      description: Returns the user's notification preference settings.
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  push_enabled:
                    type: boolean
                  email_enabled:
                    type: boolean

    patch:
      operationId: updateNotificationPrefs
      tags: [Notifications]
      summary: Update notification preferences
      description: Toggle push/email notification preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                push_enabled:
                  type: boolean
                email_enabled:
                  type: boolean
      responses:
        '200':
          description: Preferences updated

  # ══════════════════════════════════════════════════════════════════════════
  # ADMIN
  # ══════════════════════════════════════════════════════════════════════════
  /admin/probe:
    get:
      operationId: adminProbe
      tags: [Admin]
      summary: Admin probe
      description: |
        Tests whether the current user has admin privileges.
        Returns 200 if admin claim is valid, 403 otherwise.
      responses:
        '200':
          description: Admin confirmed
        '403':
          description: Admin claim required

  /admin/verifications:
    get:
      operationId: listVerifications
      tags: [Admin]
      summary: List verification submissions
      description: |
        Returns verification submissions with user details.
        Filter by status (pending, approved, rejected).
        Shows rejection history for users with prior rejections.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
          description: "Filter by verification status"
      responses:
        '200':
          description: Verification queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  verifications:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Verification'
                        - type: object
                          properties:
                            user_display_name:
                              type: string
                            user_email:
                              type: string
                            rejection_history:
                              type: array
                              items:
                                type: object
                                properties:
                                  reason:
                                    type: string
                                  reviewed_at:
                                    type: string
        '403':
          description: Admin required

  /admin/verifications/{id}/approve:
    post:
      operationId: approveVerification
      tags: [Admin]
      summary: Approve a verification
      description: |
        Approves the verification and updates the user's verification_status
        to "verified" in the same transaction.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification approved
        '403':
          description: Admin required

  /admin/verifications/{id}/reject:
    post:
      operationId: rejectVerification
      tags: [Admin]
      summary: Reject a verification
      description: Rejects the verification with a reason. User can resubmit.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: "Reason for rejection (visible to user)"
      responses:
        '200':
          description: Verification rejected
        '403':
          description: Admin required

  /admin/reports:
    get:
      operationId: listReports
      tags: [Admin]
      summary: List reports
      description: Returns reports with optional status filter.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, reviewing, actioned, dismissed]
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Report'
                        - type: object
                          properties:
                            reporter_name:
                              type: string
                            reported_name:
                              type: string
        '403':
          description: Admin required

  /admin/reports/{id}:
    patch:
      operationId: updateReportStatus
      tags: [Admin]
      summary: Update report status
      description: |
        Transitions report status: open -> reviewing -> actioned/dismissed.
        Invalid transitions return 409.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [reviewing, actioned, dismissed]
      responses:
        '200':
          description: Report updated
        '403':
          description: Admin required
        '409':
          description: Invalid status transition

  /admin/reports/{id}/action:
    post:
      operationId: actionReport
      tags: [Admin]
      summary: Take action on a report
      description: |
        Executes an admin action on the reported user. Options:
        - warn: sends warning notification
        - suspend: suspends user account (reversible)
        - ban: permanently bans user (not reversible via API)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [warn, suspend, ban]
                note:
                  type: string
                  description: "Internal admin note"
      responses:
        '200':
          description: Action executed
        '403':
          description: Admin required

  /admin/disputes:
    get:
      operationId: listDisputes
      tags: [Admin]
      summary: List disputes
      description: |
        Returns disputes with task details, party info, and conversation thread.
        Filter by status (open, under_review, resolved).
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, under_review, resolved]
      responses:
        '200':
          description: Disputes
          content:
            application/json:
              schema:
                type: object
                properties:
                  disputes:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Dispute'
                        - type: object
                          properties:
                            task_title:
                              type: string
                            poster_name:
                              type: string
                            worker_name:
                              type: string
                            conversation_thread:
                              type: array
                              items:
                                $ref: '#/components/schemas/Message'
        '403':
          description: Admin required

  /admin/disputes/{id}/triage:
    patch:
      operationId: triageDispute
      tags: [Admin]
      summary: Triage a dispute
      description: Moves dispute from "open" to "under_review". No money movement.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispute triaged
        '403':
          description: Admin required

  /admin/disputes/{id}/resolve:
    post:
      operationId: resolveDispute
      tags: [Admin]
      summary: Resolve a dispute
      description: |
        Resolves the dispute with a financial decision:
        - released: full payment to worker
        - refunded: full refund to poster
        - split: custom split between poster and worker
        Uses the shared ledger functions for all money movement.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [released, refunded, split]
                  description: "Financial resolution"
                compensation_amount:
                  type: integer
                  nullable: true
                  description: "Required for split: amount going to worker"
                resolution_notes:
                  type: string
                  description: "Admin notes (visible to both parties)"
      responses:
        '200':
          description: Dispute resolved
        '403':
          description: Admin required
        '409':
          description: Dispute already resolved

  /admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [Admin]
      summary: Suspend a user
      description: |
        Suspends a user. Suspended users cannot:
        - Create tasks
        - Make offers
        - Send messages
        Suspensions are reversible via reinstate.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: User suspended

  /admin/users/{id}/ban:
    post:
      operationId: banUser
      tags: [Admin]
      summary: Ban a user
      description: |
        Permanently bans a user. Banned users cannot access the platform.
        Banning is NOT reversible through the reinstate endpoint.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: User banned

  /admin/users/{id}/reinstate:
    post:
      operationId: reinstateUser
      tags: [Admin]
      summary: Reinstate a suspended user
      description: |
        Removes suspension from a user. Only works for suspended users.
        Banned users CANNOT be reinstated through this endpoint.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User reinstated
        '400':
          description: User is banned (not suspended)

  /admin/search:
    get:
      operationId: adminSearch
      tags: [Admin]
      summary: Search users
      description: |
        Admin user search by name, email, or phone.
        Returns matching users with profile details.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: "Search query (name, email, or phone)"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          description: Admin required

  /admin/payouts/batches:
    get:
      operationId: listPayoutBatches
      tags: [Admin]
      summary: List payout batches
      description: Returns payout batch history with status and amounts.
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Payout batches
          content:
            application/json:
              schema:
                type: object
                properties:
                  batches:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutBatch'

  /admin/payouts/batch:
    post:
      operationId: createPayoutBatch
      tags: [Admin]
      summary: Create payout batch
      description: |
        Creates a new payout batch from all eligible pending withdrawals.
        Groups them into a single batch for processing.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutBatch'

  /admin/payouts/batch/{id}:
    get:
      operationId: getPayoutBatch
      tags: [Admin]
      summary: Get payout batch details
      description: Returns batch with all included withdrawal items.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Batch detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: '#/components/schemas/PayoutBatch'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutBatchItem'

  /admin/payouts/batch/{id}/confirm:
    post:
      operationId: confirmPayoutBatch
      tags: [Admin]
      summary: Confirm payout batch
      description: |
        Confirms the batch for processing. Transitions status from
        "pending" to "confirmed". Kicks off the actual payout processing.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Batch confirmed

  # ══════════════════════════════════════════════════════════════════════════
  # WEBHOOKS
  # ══════════════════════════════════════════════════════════════════════════
  /webhooks/payments:
    post:
      operationId: paymentWebhook
      tags: [Webhooks]
      summary: Payment provider webhook
      description: |
        Receives webhook events from the payment provider.
        Verifies signature via X-Webhook-Signature header.
        Idempotent via idempotency_key. Audit logged.
        Never creates money without a pending transaction.
      parameters:
        - in: header
          name: X-Webhook-Signature
          required: true
          schema:
            type: string
          description: "HMAC signature of the request body"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id:
                  type: string
                  description: "Provider event ID"
                type:
                  type: string
                  enum: [payout.completed, payout.failed, payout.processing]
                  description: "Event type"
                idempotency_key:
                  type: string
                provider_ref:
                  type: string
                status:
                  type: string
                amount:
                  type: integer
      responses:
        '200':
          description: Processed or duplicate (idempotent)
        '401':
          description: Invalid webhook signature

  # ══════════════════════════════════════════════════════════════════════════
  # CRON (internal)
  # ══════════════════════════════════════════════════════════════════════════
  /internal/cron/auto-release:
    post:
      operationId: autoReleaseCron
      tags: [Cron]
      summary: Auto-release escrow
      description: |
        Cron job that releases escrow for tasks past their auto_release_at
        timestamp. Uses the shared release function. Idempotent via
        unique index on released transactions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of tasks released

  /internal/cron/auto-release-warning:
    post:
      operationId: autoReleaseWarningCron
      tags: [Cron]
      summary: Send auto-release warning
      description: |
        Cron job that notifies posters 24 hours before auto-release.
        Sends a notification and system message. Idempotent.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Warning notification IDs

  /internal/cron/publish-reviews:
    post:
      operationId: publishReviewsCron
      tags: [Cron]
      summary: Publish reviews
      description: |
        Cron job that publishes reviews when:
        1. Both parties have submitted (double-blind complete)
        2. 14 days have passed since first submission
        Recomputes rating aggregates for the reviewee.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of reviews published

  # ══════════════════════════════════════════════════════════════════════════
  # DOCS
  # ══════════════════════════════════════════════════════════════════════════
  /openapi.yaml:
    get:
      operationId: openapiSpec
      tags: [Docs]
      security: []
      summary: OpenAPI specification
      description: Returns this OpenAPI document in YAML format.
      responses:
        '200':
          description: YAML spec

  /docs:
    get:
      operationId: scalarDocs
      tags: [Docs]
      security: []
      summary: Scalar API reference
      description: Interactive API documentation powered by Scalar.
      responses:
        '200':
          description: HTML documentation UI

  /swagger:
    get:
      operationId: swaggerUI
      tags: [Docs]
      security: []
      summary: Swagger UI
      description: Interactive API documentation powered by Swagger UI.
      responses:
        '200':
          description: HTML documentation UI
